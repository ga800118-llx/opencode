name: product

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  foundation:
    name: thin-fork foundation
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck App
        run: bun run --cwd packages/app typecheck

      - name: Typecheck Desktop
        run: bun run --cwd packages/desktop typecheck

      - name: Test App
        working-directory: packages/app
        run: bun run test

      - name: Typecheck App E2E
        working-directory: packages/app
        run: bun run typecheck:e2e

      - name: Test App E2E
        working-directory: packages/app
        env:
          PLAYWRIGHT_WORKERS: "1"
        run: bun run test:e2e

      - name: Test Desktop
        working-directory: packages/desktop
        run: bun test

      - name: Test Core runtime
        working-directory: packages/core
        run: bun test --timeout 30000 --only-failures

      - name: Test OpenCode runtime
        working-directory: packages/opencode
        env:
          npm_config_offline: "true"
        run: bun test --timeout 60000 --only-failures --max-concurrency=1

      - name: Test LLM runtime
        working-directory: packages/llm
        run: bun test --timeout 30000 --only-failures

      - name: Typecheck runtime boundaries
        run: |
          bun run --cwd packages/core typecheck
          bun run --cwd packages/opencode typecheck
          bun run --cwd packages/llm typecheck
          bun run --cwd packages/protocol typecheck
          bun run --cwd packages/server typecheck

      - name: Check generated clients
        working-directory: packages/client
        run: bun run check:generated

      - name: Package and smoke-test Mac internal beta
        working-directory: packages/desktop
        env:
          MODELS_DEV_API_JSON: ${{ github.workspace }}/packages/core/test/plugin/fixtures/models-dev.json
          OPENCODE_CHANNEL: dev
        run: bun run package:mac:internal
