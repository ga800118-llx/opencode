name: Windows internal beta

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MODELS_DEV_API_JSON: ${{ github.workspace }}\packages\core\test\plugin\fixtures\models-dev.json

jobs:
  build-and-verify:
    name: Build and verify Windows x64 beta
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Initialize smoke evidence
        id: initialize_evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "guai-code-windows-internal-beta-smoke-evidence"
          Remove-Item -LiteralPath $evidenceDirectory -Recurse -Force -ErrorAction SilentlyContinue
          [void](New-Item -ItemType Directory -Path $evidenceDirectory -Force)
          [ordered]@{
            schemaVersion = 1
            sourceCommit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerImage = $env:ImageOS
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidenceDirectory "workflow-context.json") -Encoding utf8

      - name: Resolve internal beta version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packagePath = Join-Path $env:GITHUB_WORKSPACE "packages\desktop\package.json"
          $version = [string]((Get-Content -LiteralPath $packagePath -Raw -Encoding utf8 | ConvertFrom-Json).version)
          if ($version -cne "0.1.0-alpha.2") {
            throw "Unexpected Desktop internal beta version: $version"
          }
          $deliveryDirectory = Join-Path $env:GITHUB_WORKSPACE "packages\desktop\dist\internal-beta\$version\windows-x64"
          "GUAI_CODE_BETA_VERSION=$version" >> $env:GITHUB_ENV
          "GUAI_CODE_BETA_DELIVERY=$deliveryDirectory" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "delivery=$deliveryDirectory" >> $env:GITHUB_OUTPUT

      - name: Setup Bun
        id: setup_bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Parse verifier with Windows PowerShell 5.1
        id: parse_ps51
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $parseErrors = $null
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "packages\desktop\scripts\verify-internal-windows.ps1"
          [void][System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors)
          $parseErrorCount = @($parseErrors).Count
          Write-Host "Windows PowerShell 5.1 parse error count: $parseErrorCount"
          if ($parseErrorCount -ne 0) {
            throw ($parseErrors | Format-List | Out-String)
          }

      - name: Parse verifier with PowerShell 7
        id: parse_pwsh7
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $parseErrors = $null
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "packages\desktop\scripts\verify-internal-windows.ps1"
          [void][System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors)
          $parseErrorCount = @($parseErrors).Count
          Write-Host "PowerShell 7 parse error count: $parseErrorCount"
          if ($parseErrorCount -ne 0) {
            throw ($parseErrors | Format-List | Out-String)
          }

      - name: Validate safeStorage byte-scan counterexample
        id: byte_scan_test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          const canary = "static-safe-storage-byte-canary"
          const plaintextBuffer = Buffer.from(canary, "utf8")
          const misalignedCiphertext = Buffer.concat([Buffer.from([0x5a]), plaintextBuffer, Buffer.from([0xa5])])
          const persistedBase64 = misalignedCiphertext.toString("base64")
          if (persistedBase64.includes(plaintextBuffer.toString("base64"))) {
            throw new Error("counterexample did not defeat the old Base64 substring check")
          }
          if (!misalignedCiphertext.includes(plaintextBuffer)) {
            throw new Error("raw byte scan did not detect embedded plaintext")
          }
          '@ | node
          if ($LASTEXITCODE -ne 0) {
            throw "safeStorage byte-scan counterexample failed with exit code $LASTEXITCODE."
          }

      - name: Prepare and test credential scanner
        id: prepare_scanner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scannerPath = Join-Path $env:RUNNER_TEMP "guai-code-credential-scan.cjs"
          @'
          const { lstat, mkdir, mkdtemp, readdir, readFile, rm, writeFile } = require("node:fs/promises")
          const { tmpdir } = require("node:os")
          const { basename, join, resolve } = require("node:path")

          const patterns = [
            { label: "api-key-canary", bytes: Buffer.from("phase2-api-key-canary", "utf8") },
            { label: "header-canary", bytes: Buffer.from("phase2-header-canary", "utf8") },
            { label: "test-secret", bytes: Buffer.from("sk-test-secret", "utf8") },
            { label: "bearer-header", bytes: Buffer.from("Bearer secret-header", "utf8") },
          ]

          const compareNames = (left, right) => (left.name < right.name ? -1 : left.name > right.name ? 1 : 0)

          async function regularFiles(directory) {
            const root = resolve(directory)
            const rootStat = await lstat(root)
            if (!rootStat.isDirectory()) {
              const error = new Error("scan-target-not-directory")
              error.code = "ENOTDIR"
              error.path = root
              throw error
            }

            const files = []
            async function walk(current) {
              const entries = (await readdir(current, { withFileTypes: true })).sort(compareNames)
              for (const entry of entries) {
                const child = join(current, entry.name)
                if (entry.isDirectory()) {
                  await walk(child)
                  continue
                }
                if (entry.isFile()) files.push(child)
              }
            }
            await walk(root)
            return files
          }

          async function scanTargets(targets) {
            const matches = []
            for (const target of targets) {
              for (const file of await regularFiles(target.directory)) {
                const contents = await readFile(file)
                for (const pattern of patterns) {
                  if (contents.includes(pattern.bytes)) {
                    matches.push({ file, target: target.label, pattern: pattern.label })
                  }
                }
              }
            }
            return matches
          }

          async function selfTest() {
            const directory = await mkdtemp(join(tmpdir(), "guai-code-credential-scan-test-"))
            try {
              const nested = join(directory, "nested")
              await mkdir(nested)
              await writeFile(join(nested, "clean.bin"), Buffer.from([0x00, 0xff, 0x41, 0x00]))
              if ((await scanTargets([{ label: "self-test", directory }])).length !== 0) {
                throw new Error("clean-fixture-matched")
              }
              const hit = join(nested, "hit.bin")
              await writeFile(hit, Buffer.concat([Buffer.from([0x00, 0xff]), patterns[2].bytes, Buffer.from([0x00])]))
              const matches = await scanTargets([{ label: "self-test", directory }])
              if (matches.length !== 1 || basename(matches[0].file) !== "hit.bin" || matches[0].pattern !== "test-secret") {
                throw new Error("binary-fixture-not-detected")
              }
            } finally {
              await rm(directory, { recursive: true, force: true })
            }
            process.stdout.write("credential scanner self-test passed\n")
          }

          async function main() {
            const args = process.argv.slice(2)
            if (args.length === 1 && args[0] === "--self-test") {
              await selfTest()
              return
            }
            if (args.length === 0 || args.length % 2 !== 0) throw new Error("invalid-scan-targets")
            const targets = Array.from({ length: args.length / 2 }, (_, index) => ({
              label: args[index * 2],
              directory: args[index * 2 + 1],
            }))
            const matches = await scanTargets(targets)
            for (const match of matches) {
              process.stdout.write(`${match.file}\t${match.target}\t${match.pattern}\n`)
            }
            if (matches.length > 0) process.exitCode = 1
          }

          main().catch((error) => {
            const code = typeof error.code === "string" ? error.code : "SCAN_ERROR"
            const file = typeof error.path === "string" ? error.path : "unknown"
            process.stderr.write(`${file}\tscan-error\t${code}\n`)
            process.exitCode = 2
          })
          '@ | Set-Content -LiteralPath $scannerPath -Encoding utf8

          & node --check $scannerPath
          if ($LASTEXITCODE -ne 0) {
            throw "Credential scanner syntax check failed with exit code $LASTEXITCODE."
          }
          & node $scannerPath --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Credential scanner self-test failed with exit code $LASTEXITCODE."
          }

      - name: Test Desktop
        id: desktop_test
        working-directory: packages/desktop
        shell: pwsh
        run: bun test

      - name: Typecheck Desktop
        id: desktop_typecheck
        working-directory: packages/desktop
        shell: pwsh
        run: bun typecheck

      - name: Test App units
        id: app_unit_test
        working-directory: packages/app
        shell: pwsh
        run: bun run test:unit

      - name: Typecheck App
        id: app_typecheck
        working-directory: packages/app
        shell: pwsh
        run: bun typecheck

      - name: Package Windows internal beta
        id: package
        working-directory: packages/desktop
        shell: pwsh
        run: bun run package:win:internal

      - name: Verify native safeStorage across processes
        id: safe_storage
        working-directory: packages/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "guai-code-safe-storage-smoke"
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "guai-code-windows-internal-beta-smoke-evidence"
          $safeStorageEvidence = Join-Path $evidenceDirectory "safe-storage-dpapi.json"
          $profileDirectory = Join-Path $smokeRoot "profile"
          $localStatePath = Join-Path $profileDirectory "Local State"
          $ciphertextPath = Join-Path $smokeRoot "ciphertext.base64"
          $encryptResultPath = Join-Path $smokeRoot "encrypt-result.json"
          $decryptResultPath = Join-Path $smokeRoot "decrypt-result.json"
          $electronTimeoutSeconds = 90

          function Invoke-ElectronSmokeProcess {
            param(
              [string]$ElectronPath,
              [string]$ApplicationPath,
              [string]$UserDataPath,
              [string]$Mode,
              [int]$TimeoutSeconds
            )

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $ElectronPath
            $startInfo.WorkingDirectory = $ApplicationPath
            $startInfo.UseShellExecute = $false
            [void]$startInfo.ArgumentList.Add($ApplicationPath)
            [void]$startInfo.ArgumentList.Add("--user-data-dir=$UserDataPath")
            [void]$startInfo.ArgumentList.Add("--disable-gpu")
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            try {
              if (-not $process.Start()) {
                throw "safeStorage $Mode Electron process did not start."
              }
              if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
                $process.Kill($true)
                if (-not $process.WaitForExit(10000)) {
                  throw "safeStorage $Mode Electron process tree did not exit after termination."
                }
                throw "safeStorage $Mode Electron process timed out after $TimeoutSeconds seconds."
              }
              return [ordered]@{
                processId = $process.Id
                exitCode = $process.ExitCode
              }
            }
            finally {
              $process.Dispose()
            }
          }

          function Get-DurableLocalStateStatus {
            param([string]$Path)

            $status = [ordered]@{
              localStateExists = $false
              localStateValid = $false
              encryptedKeyPresent = $false
            }
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              return $status
            }

            $status.localStateExists = $true
            try {
              $localState = Get-Content -LiteralPath $Path -Raw -Encoding utf8 | ConvertFrom-Json
              $status.localStateValid = $null -ne $localState
              $status.encryptedKeyPresent = (
                $null -ne $localState.os_crypt -and
                -not [string]::IsNullOrWhiteSpace([string]$localState.os_crypt.encrypted_key)
              )
            }
            catch {
              $status.localStateValid = $false
              $status.encryptedKeyPresent = $false
            }
            return $status
          }

          function Wait-DurableLocalState {
            param(
              [string]$Path,
              [int]$TimeoutSeconds
            )

            $deadline = [DateTime]::UtcNow.AddSeconds($TimeoutSeconds)
            do {
              $status = Get-DurableLocalStateStatus -Path $Path
              if ($status.localStateExists -and $status.localStateValid -and $status.encryptedKeyPresent) {
                return $status
              }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            return (Get-DurableLocalStateStatus -Path $Path)
          }

          function Select-AllowlistedDiagnostic {
            param(
              [string]$Value,
              [string[]]$Allowed,
              [string]$Fallback
            )

            if ($Allowed -ccontains $Value) {
              return $Value
            }
            return $Fallback
          }

          Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          [void](New-Item -ItemType Directory -Path $smokeRoot -Force)
          [void](New-Item -ItemType Directory -Path $profileDirectory -Force)

          @'
          {"name":"guai-code-safe-storage-smoke","version":"1.0.0","private":true,"main":"main.cjs"}
          '@ | Set-Content -LiteralPath (Join-Path $smokeRoot "package.json") -Encoding ascii

          @'
          const { app, safeStorage } = require("electron")
          const { createHash, randomBytes } = require("node:crypto")
          const { existsSync, mkdirSync, readFileSync, unlinkSync, writeFileSync } = require("node:fs")
          const { join, resolve } = require("node:path")

          const mode = process.env.GUAI_CODE_SAFE_STORAGE_MODE
          const ciphertextPath = process.env.GUAI_CODE_SAFE_STORAGE_CIPHERTEXT
          const resultPath = process.env.GUAI_CODE_SAFE_STORAGE_RESULT
          const expectedProfilePath = resolve(process.env.GUAI_CODE_SAFE_STORAGE_USER_DATA)
          const localStatePath = join(expectedProfilePath, "Local State")

          const sha256 = (value) => createHash("sha256").update(value).digest("hex")
          const fail = (code) => {
            const error = new Error()
            error.name = "SafeStorageSmokeError"
            error.safeCode = code
            throw error
          }
          const decodeBase64Strict = (value) => {
            if (
              value.length === 0 ||
              !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value)
            ) {
              fail("INVALID_BASE64")
            }
            const decoded = Buffer.from(value, "base64")
            if (decoded.toString("base64") !== value) fail("NON_CANONICAL_BASE64")
            return decoded
          }
          const userIdentity = `${process.env.USERDOMAIN || ""}\\${process.env.USERNAME || ""}`
          const writeResult = (result) =>
            writeFileSync(resultPath, `${JSON.stringify(result)}\n`, { encoding: "utf8", flag: "wx" })
          const allowedFailureCodes = new Set([
            "PROFILE_PATH_MISMATCH",
            "NATIVE_WINDOWS_REQUIRED",
            "ENCRYPTION_UNAVAILABLE",
            "INVALID_MODE",
            "INVALID_BASE64",
            "NON_CANONICAL_BASE64",
            "PLAINTEXT_IN_ENCRYPTED_BYTES",
            "PERSISTED_CIPHERTEXT_MISMATCH",
            "PLAINTEXT_IN_PERSISTED_CIPHERTEXT",
            "LOCAL_STATE_NOT_READY",
            "CIPHERTEXT_NOT_DELETED",
          ])
          const inspectLocalState = () => {
            const status = {
              localStateExists: existsSync(localStatePath),
              localStateValid: false,
              encryptedKeyPresent: false,
            }
            if (!status.localStateExists) return status
            try {
              const localStateContents = JSON.parse(readFileSync(localStatePath, "utf8"))
              status.localStateValid =
                localStateContents !== null && typeof localStateContents === "object" && !Array.isArray(localStateContents)
              status.encryptedKeyPresent =
                typeof localStateContents?.os_crypt?.encrypted_key === "string" &&
                localStateContents.os_crypt.encrypted_key.trim().length > 0
            } catch {}
            return status
          }

          let failureStage = "configure-profile"
          let actualPathsMatched = false
          const writeFailure = (error) => {
            const localStateStatus = inspectLocalState()
            const failureCode = allowedFailureCodes.has(error?.safeCode) ? error.safeCode : "UNEXPECTED_ERROR"
            const errorName = ["Error", "TypeError", "SyntaxError", "SafeStorageSmokeError"].includes(error?.name)
              ? error.name
              : "Error"
            try {
              writeResult({
                schemaVersion: 1,
                success: false,
                failureStage,
                failureCode,
                errorName,
                ...localStateStatus,
                actualPathsMatched,
              })
            } catch {}
            console.error(`safeStorage smoke failed at ${failureStage} (${failureCode})`)
            process.exitCode = 1
            app.quit()
          }

          let startupError
          try {
            mkdirSync(expectedProfilePath, { recursive: true })
            app.setPath("userData", expectedProfilePath)
            app.setPath("sessionData", expectedProfilePath)
            actualPathsMatched = [app.getPath("userData"), app.getPath("sessionData")].every(
              (value) => resolve(value).toLowerCase() === expectedProfilePath.toLowerCase(),
            )
            if (!actualPathsMatched) fail("PROFILE_PATH_MISMATCH")
          } catch (error) {
            startupError = error
          }

          if (startupError) {
            writeFailure(startupError)
          } else {
            failureStage = "await-ready"
            app.whenReady().then(() => {
              failureStage = "validate-runtime"
              if (process.platform !== "win32") fail("NATIVE_WINDOWS_REQUIRED")
              if (!safeStorage.isEncryptionAvailable()) fail("ENCRYPTION_UNAVAILABLE")

              if (mode === "encrypt") {
                failureStage = "encrypt"
                let canary = `safe-storage-canary:${randomBytes(32).toString("hex")}`
                const plaintextBuffer = Buffer.from(canary, "utf8")
                const plaintextSha256 = sha256(plaintextBuffer)
                let encrypted
                try {
                  encrypted = safeStorage.encryptString(canary)
                  canary = ""
                  if (encrypted.includes(plaintextBuffer)) fail("PLAINTEXT_IN_ENCRYPTED_BYTES")
                  failureStage = "persist-ciphertext"
                  writeFileSync(ciphertextPath, encrypted.toString("base64"), { encoding: "ascii", flag: "wx" })
                  const decodedPersisted = decodeBase64Strict(readFileSync(ciphertextPath, "ascii"))
                  if (!decodedPersisted.equals(encrypted)) fail("PERSISTED_CIPHERTEXT_MISMATCH")
                  if (decodedPersisted.includes(plaintextBuffer)) fail("PLAINTEXT_IN_PERSISTED_CIPHERTEXT")
                  failureStage = "write-encrypt-result"
                  writeResult({
                    schemaVersion: 1,
                    success: true,
                    mode,
                    pid: process.pid,
                    platform: process.platform,
                    electronVersion: process.versions.electron,
                    encryptionAvailable: true,
                    userIdentitySha256: sha256(userIdentity),
                    plaintextSha256,
                    ciphertextSha256: sha256(encrypted),
                    ciphertextBytes: encrypted.length,
                    plaintextPersisted: false,
                    actualPathsMatched,
                    ...inspectLocalState(),
                  })
                } finally {
                  canary = ""
                  plaintextBuffer.fill(0)
                }
                process.exitCode = 0
                app.quit()
                return
              }

              if (mode !== "decrypt") fail("INVALID_MODE")
              failureStage = "validate-local-state"
              const localStateStatus = inspectLocalState()
              if (
                !localStateStatus.localStateExists ||
                !localStateStatus.localStateValid ||
                !localStateStatus.encryptedKeyPresent
              ) {
                fail("LOCAL_STATE_NOT_READY")
              }
              failureStage = "decrypt"
              const encoded = readFileSync(ciphertextPath, "ascii")
              const encrypted = decodeBase64Strict(encoded)
              let canary = safeStorage.decryptString(encrypted)
              const plaintextSha256 = sha256(canary)
              canary = ""
              failureStage = "delete-ciphertext"
              unlinkSync(ciphertextPath)
              if (existsSync(ciphertextPath)) fail("CIPHERTEXT_NOT_DELETED")
              failureStage = "write-decrypt-result"
              writeResult({
                schemaVersion: 1,
                success: true,
                mode,
                pid: process.pid,
                platform: process.platform,
                electronVersion: process.versions.electron,
                encryptionAvailable: true,
                userIdentitySha256: sha256(userIdentity),
                plaintextSha256,
                ciphertextSha256: sha256(encrypted),
                ciphertextBytes: encrypted.length,
                ciphertextDeleted: true,
                actualPathsMatched,
                ...localStateStatus,
              })
              process.exitCode = 0
              app.quit()
            }).catch(writeFailure)
          }
          '@ | Set-Content -LiteralPath (Join-Path $smokeRoot "main.cjs") -Encoding utf8

          $allowedFailureStages = @(
            "configure-profile",
            "await-ready",
            "validate-runtime",
            "encrypt",
            "persist-ciphertext",
            "write-encrypt-result",
            "validate-local-state",
            "decrypt",
            "delete-ciphertext",
            "write-decrypt-result",
            "resolve-electron",
            "encrypt-process",
            "encrypt-result",
            "durable-local-state",
            "decrypt-process",
            "decrypt-result",
            "verify-proof",
            "write-evidence"
          )
          $allowedFailureCodes = @(
            "PROFILE_PATH_MISMATCH",
            "NATIVE_WINDOWS_REQUIRED",
            "ENCRYPTION_UNAVAILABLE",
            "INVALID_MODE",
            "INVALID_BASE64",
            "NON_CANONICAL_BASE64",
            "PLAINTEXT_IN_ENCRYPTED_BYTES",
            "PERSISTED_CIPHERTEXT_MISMATCH",
            "PLAINTEXT_IN_PERSISTED_CIPHERTEXT",
            "LOCAL_STATE_NOT_READY",
            "CIPHERTEXT_NOT_DELETED",
            "UNEXPECTED_ERROR",
            "ELECTRON_RESOLUTION_FAILED",
            "ENCRYPT_PROCESS_FAILED",
            "DECRYPT_PROCESS_FAILED",
            "RESULT_MISSING",
            "RESULT_INVALID",
            "RESULT_CONTRACT_MISMATCH",
            "LOCAL_STATE_NOT_DURABLE",
            "PROOF_MISMATCH",
            "EVIDENCE_WRITE_FAILED"
          )
          $allowedErrorNames = @("Error", "TypeError", "SyntaxError", "SafeStorageSmokeError", "PowerShellError")
          $failureStage = "resolve-electron"
          $failureCode = "ELECTRON_RESOLUTION_FAILED"
          $failureErrorName = "PowerShellError"
          $actualPathsMatched = $false
          $localStateStatus = Get-DurableLocalStateStatus -Path $localStatePath

          try {
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
            $electronPath = (& bun -e 'process.stdout.write(require("electron"))').Trim()
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $electronPath -PathType Leaf)) {
              throw "Repository Electron executable was not found."
            }

            $env:GUAI_CODE_SAFE_STORAGE_CIPHERTEXT = $ciphertextPath
            $env:GUAI_CODE_SAFE_STORAGE_USER_DATA = $profileDirectory
            $env:GUAI_CODE_SAFE_STORAGE_MODE = "encrypt"
            $env:GUAI_CODE_SAFE_STORAGE_RESULT = $encryptResultPath
            $failureStage = "encrypt-process"
            $failureCode = "ENCRYPT_PROCESS_FAILED"
            $encryptProcess = Invoke-ElectronSmokeProcess -ElectronPath $electronPath -ApplicationPath $smokeRoot -UserDataPath $profileDirectory -Mode "encryption" -TimeoutSeconds $electronTimeoutSeconds

            $failureStage = "encrypt-result"
            $failureCode = "RESULT_MISSING"
            if (-not (Test-Path -LiteralPath $encryptResultPath -PathType Leaf)) {
              throw "safeStorage encryption result is missing."
            }
            try {
              $encryptResult = Get-Content -LiteralPath $encryptResultPath -Raw -Encoding utf8 | ConvertFrom-Json
            }
            catch {
              $failureCode = "RESULT_INVALID"
              throw "safeStorage encryption result is invalid."
            }
            if (-not $encryptResult.success) {
              $failureStage = Select-AllowlistedDiagnostic -Value ([string]$encryptResult.failureStage) -Allowed $allowedFailureStages -Fallback "encrypt-result"
              $failureCode = Select-AllowlistedDiagnostic -Value ([string]$encryptResult.failureCode) -Allowed $allowedFailureCodes -Fallback "UNEXPECTED_ERROR"
              $failureErrorName = Select-AllowlistedDiagnostic -Value ([string]$encryptResult.errorName) -Allowed $allowedErrorNames -Fallback "Error"
              $actualPathsMatched = [bool]$encryptResult.actualPathsMatched
              $localStateStatus = [ordered]@{
                localStateExists = [bool]$encryptResult.localStateExists
                localStateValid = [bool]$encryptResult.localStateValid
                encryptedKeyPresent = [bool]$encryptResult.encryptedKeyPresent
              }
              throw "safeStorage encryption process reported failure."
            }
            if ($encryptProcess.exitCode -ne 0) {
              $failureCode = "ENCRYPT_PROCESS_FAILED"
              throw "safeStorage encryption process exited unsuccessfully."
            }
            $actualPathsMatched = [bool]$encryptResult.actualPathsMatched
            if (
              $encryptResult.mode -cne "encrypt" -or
              $encryptResult.pid -ne $encryptProcess.processId -or
              -not $actualPathsMatched
            ) {
              $failureCode = "RESULT_CONTRACT_MISMATCH"
              throw "safeStorage encryption result failed validation."
            }

            $failureStage = "durable-local-state"
            $failureCode = "LOCAL_STATE_NOT_DURABLE"
            $localStateStatus = Wait-DurableLocalState -Path $localStatePath -TimeoutSeconds 15
            if (
              -not $localStateStatus.localStateExists -or
              -not $localStateStatus.localStateValid -or
              -not $localStateStatus.encryptedKeyPresent
            ) {
              throw "safeStorage Local State was not durable after encryption."
            }
            Start-Sleep -Milliseconds 500

            $env:GUAI_CODE_SAFE_STORAGE_MODE = "decrypt"
            $env:GUAI_CODE_SAFE_STORAGE_RESULT = $decryptResultPath
            $failureStage = "decrypt-process"
            $failureCode = "DECRYPT_PROCESS_FAILED"
            $decryptProcess = Invoke-ElectronSmokeProcess -ElectronPath $electronPath -ApplicationPath $smokeRoot -UserDataPath $profileDirectory -Mode "decryption" -TimeoutSeconds $electronTimeoutSeconds

            $failureStage = "decrypt-result"
            $failureCode = "RESULT_MISSING"
            if (-not (Test-Path -LiteralPath $decryptResultPath -PathType Leaf)) {
              throw "safeStorage decryption result is missing."
            }
            try {
              $decryptResult = Get-Content -LiteralPath $decryptResultPath -Raw -Encoding utf8 | ConvertFrom-Json
            }
            catch {
              $failureCode = "RESULT_INVALID"
              throw "safeStorage decryption result is invalid."
            }
            if (-not $decryptResult.success) {
              $failureStage = Select-AllowlistedDiagnostic -Value ([string]$decryptResult.failureStage) -Allowed $allowedFailureStages -Fallback "decrypt-result"
              $failureCode = Select-AllowlistedDiagnostic -Value ([string]$decryptResult.failureCode) -Allowed $allowedFailureCodes -Fallback "UNEXPECTED_ERROR"
              $failureErrorName = Select-AllowlistedDiagnostic -Value ([string]$decryptResult.errorName) -Allowed $allowedErrorNames -Fallback "Error"
              $actualPathsMatched = [bool]$decryptResult.actualPathsMatched
              $localStateStatus = [ordered]@{
                localStateExists = [bool]$decryptResult.localStateExists
                localStateValid = [bool]$decryptResult.localStateValid
                encryptedKeyPresent = [bool]$decryptResult.encryptedKeyPresent
              }
              throw "safeStorage decryption process reported failure."
            }
            if ($decryptProcess.exitCode -ne 0) {
              $failureCode = "DECRYPT_PROCESS_FAILED"
              throw "safeStorage decryption process exited unsuccessfully."
            }
            $actualPathsMatched = $actualPathsMatched -and [bool]$decryptResult.actualPathsMatched
            if (
              $decryptResult.mode -cne "decrypt" -or
              $decryptResult.pid -ne $decryptProcess.processId -or
              -not $actualPathsMatched -or
              -not $decryptResult.localStateExists -or
              -not $decryptResult.localStateValid -or
              -not $decryptResult.encryptedKeyPresent
            ) {
              $failureCode = "RESULT_CONTRACT_MISMATCH"
              throw "safeStorage decryption result failed validation."
            }

            $failureStage = "verify-proof"
            $failureCode = "PROOF_MISMATCH"
            if (
              $encryptResult.pid -eq $decryptResult.pid -or
              $encryptResult.userIdentitySha256 -cne $decryptResult.userIdentitySha256 -or
              $encryptResult.plaintextSha256 -cne $decryptResult.plaintextSha256 -or
              $encryptResult.ciphertextSha256 -cne $decryptResult.ciphertextSha256 -or
              $encryptResult.plaintextPersisted -or
              -not $decryptResult.ciphertextDeleted -or
              (Test-Path -LiteralPath $ciphertextPath)
            ) {
              throw "safeStorage cross-process proof failed validation."
            }

            $failureStage = "write-evidence"
            $failureCode = "EVIDENCE_WRITE_FAILED"
            [ordered]@{
              schemaVersion = 1
              success = $true
              platform = $encryptResult.platform
              electronVersion = $encryptResult.electronVersion
              encryptionAvailable = $true
              nativeProtection = "Windows DPAPI via Electron safeStorage"
              independentProcesses = $true
              sameUser = $true
              encryptProcessId = $encryptResult.pid
              decryptProcessId = $decryptResult.pid
              plaintextSha256 = $encryptResult.plaintextSha256
              ciphertextSha256 = $encryptResult.ciphertextSha256
              ciphertextBytes = $encryptResult.ciphertextBytes
              plaintextPersisted = $false
              ciphertextDeleted = $true
              localStateExists = $true
              localStateValid = $true
              encryptedKeyPresent = $true
              actualPathsMatched = $true
            } | ConvertTo-Json | Set-Content -LiteralPath $safeStorageEvidence -Encoding utf8
          }
          catch {
            $failureErrorName = Select-AllowlistedDiagnostic -Value $failureErrorName -Allowed $allowedErrorNames -Fallback "PowerShellError"
            $localStateStatus = Get-DurableLocalStateStatus -Path $localStatePath
            [ordered]@{
              schemaVersion = 1
              success = $false
              failureStage = $failureStage
              failureCode = $failureCode
              errorName = $failureErrorName
              localStateExists = [bool]$localStateStatus.localStateExists
              localStateValid = [bool]$localStateStatus.localStateValid
              encryptedKeyPresent = [bool]$localStateStatus.encryptedKeyPresent
              actualPathsMatched = [bool]$actualPathsMatched
            } | ConvertTo-Json | Set-Content -LiteralPath $safeStorageEvidence -Encoding utf8
            throw "safeStorage smoke failed at stage '$failureStage' with code '$failureCode'."
          }
          finally {
            Remove-Item Env:GUAI_CODE_SAFE_STORAGE_MODE -ErrorAction SilentlyContinue
            Remove-Item Env:GUAI_CODE_SAFE_STORAGE_CIPHERTEXT -ErrorAction SilentlyContinue
            Remove-Item Env:GUAI_CODE_SAFE_STORAGE_RESULT -ErrorAction SilentlyContinue
            Remove-Item Env:GUAI_CODE_SAFE_STORAGE_USER_DATA -ErrorAction SilentlyContinue
            $smokeRootRemaining = $true
            try {
              Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction Stop
              $smokeRootRemaining = Test-Path -LiteralPath $smokeRoot -ErrorAction Stop
            }
            catch {}
            if ($smokeRootRemaining) {
              throw "safeStorage smoke cleanup failed."
            }
          }

      - name: Verify installed Windows package
        id: verifier
        if: always() && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & (Join-Path $env:GITHUB_WORKSPACE "packages\desktop\scripts\verify-internal-windows.ps1") `
            -DeliveryDirectory $env:GUAI_CODE_BETA_DELIVERY `
            -Version $env:GUAI_CODE_BETA_VERSION `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP "guai-code-windows-internal-beta-smoke-evidence")

      - name: Scan package and smoke evidence for credential canaries
        id: credential_scan
        if: always() && steps.package.outcome == 'success' && steps.safe_storage.outcome == 'success' && steps.verifier.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "guai-code-windows-internal-beta-smoke-evidence"
          $scannerPath = Join-Path $env:RUNNER_TEMP "guai-code-credential-scan.cjs"
          $targets = @(
            [ordered]@{
              label = "win-unpacked"
              directory = Join-Path $env:GITHUB_WORKSPACE "packages\desktop\dist\win-unpacked"
            },
            [ordered]@{
              label = "delivery"
              directory = $env:GUAI_CODE_BETA_DELIVERY
            },
            [ordered]@{
              label = "smoke-evidence"
              directory = $evidenceDirectory
            }
          )

          if (-not (Test-Path -LiteralPath $scannerPath -PathType Leaf)) {
            throw "Credential scanner is missing: $scannerPath"
          }
          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target.directory -PathType Container)) {
              throw "Credential scan target is missing: $($target.directory)"
            }
          }
          $copiedMainLogs = @(
            Get-ChildItem -LiteralPath $evidenceDirectory -File -Recurse |
              Where-Object { $_.Name -like "*main.log" }
          )
          if ($copiedMainLogs.Count -eq 0) {
            throw "Smoke evidence does not contain a copied main.log."
          }

          try {
            $arguments = @()
            foreach ($target in $targets) {
              $arguments += @($target.label, $target.directory)
            }
            & node $scannerPath @arguments
            $exitCode = $LASTEXITCODE
          }
          finally {
            Remove-Item -LiteralPath $scannerPath -Force -ErrorAction SilentlyContinue
          }
          if ($exitCode -eq 0) {
            Write-Host "Credential canary scan passed."
          }
          elseif ($exitCode -eq 1) {
            throw "Credential canary scan detected one or more forbidden patterns."
          }
          else {
            throw "Credential canary scanner failed with exit code $exitCode."
          }

      - name: Prepare uploadable smoke evidence
        id: uploadable_evidence
        if: always() && steps.package.outcome == 'success' && steps.safe_storage.outcome == 'success' && steps.verifier.outcome == 'success' && steps.credential_scan.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDirectory = Join-Path $env:RUNNER_TEMP "guai-code-windows-internal-beta-smoke-evidence"
          $uploadDirectory = Join-Path $env:RUNNER_TEMP "guai-code-windows-internal-beta-uploadable-evidence"
          $forbiddenKeys = @(
            "path",
            "directory",
            "inputDirectory",
            "installDirectory",
            "installArguments",
            "logPath",
            "evidenceLog",
            "temporaryRoot",
            "evidenceDirectory",
            "copiedLogs",
            "error",
            "message",
            "stack"
          )
          $allowedEvidenceFiles = [ordered]@{
            "workflow-context.json" = 1
            "safe-storage-dpapi.json" = 1
            "internal-windows-smoke-evidence.json" = 2
          }

          function Assert-UploadableEvidence {
            param([object]$Value)

            if ($null -eq $Value) {
              return
            }
            if ($Value -is [string]) {
              if ([System.IO.Path]::IsPathRooted([string]$Value)) {
                throw "Uploadable evidence contains a rooted path."
              }
              return
            }
            if ($Value -is [System.Collections.IDictionary]) {
              foreach ($key in @($Value.Keys)) {
                if ($forbiddenKeys -contains [string]$key) {
                  throw "Uploadable evidence contains a forbidden field."
                }
                Assert-UploadableEvidence -Value $Value[$key]
              }
              return
            }
            if ($Value -is [System.Collections.IEnumerable]) {
              foreach ($item in @($Value)) {
                Assert-UploadableEvidence -Value $item
              }
              return
            }
            foreach ($property in @($Value.PSObject.Properties)) {
              if ($forbiddenKeys -contains $property.Name) {
                throw "Uploadable evidence contains a forbidden field."
              }
              Assert-UploadableEvidence -Value $property.Value
            }
          }

          if (Test-Path -LiteralPath $uploadDirectory) {
            Remove-Item -LiteralPath $uploadDirectory -Recurse -Force -ErrorAction Stop
          }
          [void](New-Item -ItemType Directory -Path $uploadDirectory)
          foreach ($name in @($allowedEvidenceFiles.Keys)) {
            $source = Join-Path -Path $sourceDirectory -ChildPath $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required uploadable evidence is missing."
            }
            $document = Get-Content -LiteralPath $source -Raw -Encoding utf8 | ConvertFrom-Json
            if ([int]$document.schemaVersion -ne [int]$allowedEvidenceFiles[$name]) {
              throw "Uploadable evidence has an unexpected schema version."
            }
            Assert-UploadableEvidence -Value $document
            $document | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path -Path $uploadDirectory -ChildPath $name) -Encoding utf8
          }
          $uploadedNames = @(Get-ChildItem -LiteralPath $uploadDirectory -File | ForEach-Object { $_.Name })
          if ($uploadedNames.Count -ne $allowedEvidenceFiles.Count) {
            throw "Uploadable evidence contains an unexpected file count."
          }
          foreach ($name in @($allowedEvidenceFiles.Keys)) {
            if ($uploadedNames -cnotcontains $name) {
              throw "Uploadable evidence is missing an allowlisted file."
            }
          }

      - name: Prepare sanitized smoke evidence
        id: sanitized_evidence
        if: always() && steps.uploadable_evidence.outcome != 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sanitizedDirectory = Join-Path $env:RUNNER_TEMP "guai-code-windows-internal-beta-sanitized-evidence"
          Remove-Item -LiteralPath $sanitizedDirectory -Recurse -Force -ErrorAction SilentlyContinue
          [void](New-Item -ItemType Directory -Path $sanitizedDirectory -Force)
          [ordered]@{
            schemaVersion = 1
            workflowContext = [ordered]@{
              sourceCommit = $env:GITHUB_SHA
              runId = $env:GITHUB_RUN_ID
              runAttempt = $env:GITHUB_RUN_ATTEMPT
              runnerImage = $env:ImageOS
              version = $env:GUAI_CODE_BETA_VERSION
            }
            stepOutcomes = [ordered]@{
              checkout = "${{ steps.checkout.outcome }}"
              initializeEvidence = "${{ steps.initialize_evidence.outcome }}"
              resolveVersion = "${{ steps.version.outcome }}"
              setupBun = "${{ steps.setup_bun.outcome }}"
              parsePowerShell51 = "${{ steps.parse_ps51.outcome }}"
              parsePowerShell7 = "${{ steps.parse_pwsh7.outcome }}"
              byteScanTest = "${{ steps.byte_scan_test.outcome }}"
              prepareScanner = "${{ steps.prepare_scanner.outcome }}"
              desktopTest = "${{ steps.desktop_test.outcome }}"
              desktopTypecheck = "${{ steps.desktop_typecheck.outcome }}"
              appUnitTest = "${{ steps.app_unit_test.outcome }}"
              appTypecheck = "${{ steps.app_typecheck.outcome }}"
              package = "${{ steps.package.outcome }}"
              safeStorage = "${{ steps.safe_storage.outcome }}"
              verifier = "${{ steps.verifier.outcome }}"
              credentialScan = "${{ steps.credential_scan.outcome }}"
              uploadableEvidence = "${{ steps.uploadable_evidence.outcome }}"
            }
            failure = "Raw smoke evidence was withheld because evidence validation did not complete successfully."
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $sanitizedDirectory "sanitized-smoke-evidence.json") -Encoding utf8

      - name: Upload Windows delivery
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guai-code-windows-internal-beta-delivery
          path: ${{ steps.version.outputs.delivery }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated smoke evidence
        if: always() && steps.package.outcome == 'success' && steps.safe_storage.outcome == 'success' && steps.verifier.outcome == 'success' && steps.credential_scan.outcome == 'success' && steps.uploadable_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guai-code-windows-internal-beta-smoke-evidence
          path: ${{ runner.temp }}/guai-code-windows-internal-beta-uploadable-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload sanitized smoke evidence
        if: always() && steps.uploadable_evidence.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guai-code-windows-internal-beta-smoke-evidence
          path: ${{ runner.temp }}/guai-code-windows-internal-beta-sanitized-evidence
          if-no-files-found: error
          retention-days: 14
